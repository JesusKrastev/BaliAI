name: PR Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests + Debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ONE_SIGNAL_APP_ID: ${{ secrets.ONE_SIGNAL_APP_ID }}
      MIXPANEL_TOKEN: ${{ secrets.MIXPANEL_TOKEN }}
      REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
      POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
      POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # Manual runs also record the Roborazzi screenshots and keep them as an artifact, so UI
      # changes can be reviewed without a device. Pull request runs skip both steps.
      - name: Record screenshots
        if: github.event_name == 'workflow_dispatch'
        run: ./gradlew recordRoborazziDebug --stacktrace

      - name: Upload screenshots
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/outputs/roborazzi/
          retention-days: 7

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7
