name: PR Checks

on:
  pull_request:
    # develop recibe las features; release/** los arreglos de una release; main solo releases.
    branches: [main, develop, 'release/**']
  workflow_dispatch:

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Check obligatorio en main (ruleset): una feature que apunte a main por error se para aqui
  # en segundos, antes de que pr-play.yml la suba a Play.
  branch-policy:
    name: Rama de origen
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: A main solo entran release/* y hotfix/*
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$BASE_REF" != "main" ]; then
            echo "OK: $HEAD_REF -> ${BASE_REF:-sin PR}"
            exit 0
          fi
          case "$HEAD_REF" in
            release/*|hotfix/*) echo "OK: $HEAD_REF -> main" ;;
            *) echo "::error::A main solo entran release/* o hotfix/* (llega $HEAD_REF). Cambia la base del PR a develop."
               exit 1 ;;
          esac

  verify:
    name: Tests + Debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ONE_SIGNAL_APP_ID: ${{ secrets.ONE_SIGNAL_APP_ID }}
      REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
      POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
      POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7
