name: Release to Google Play

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track de destino'
        required: true
        default: internal
        type: choice
        options: [internal, alpha, beta, production]
      priority:
        description: 'Prioridad in-app update (0-5). La app abre el flujo bloqueante a partir de 4'
        required: true
        default: '0'
        type: choice
        options: ['0', '1', '2', '3', '4', '5']

concurrency:
  group: release-play
  cancel-in-progress: false

jobs:
  deploy:
    name: Build AAB + upload
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ONE_SIGNAL_APP_ID: ${{ secrets.ONE_SIGNAL_APP_ID }}
      MIXPANEL_TOKEN: ${{ secrets.MIXPANEL_TOKEN }}
      REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
      POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
      POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}

    steps:
      # Una build solo llega a Play desde la linea principal. Las dos que rompieron la migracion
      # de Firestore salieron de aqui lanzadas a mano sobre ramas sin fusionar (E-017).
      - name: Comprobar rama de origen
        env:
          REF: ${{ github.ref }}
          TRACK: ${{ inputs.track || 'internal' }}
        run: |
          case "$REF" in
            refs/heads/develop|refs/heads/main|refs/heads/release/*|refs/heads/hotfix/*|refs/tags/v*) ;;
            *) echo "::error::$REF no puede subir a Play: fusiona la rama en develop o abre una release/*."
               exit 1 ;;
          esac
          if [ "$TRACK" = "production" ]; then
            case "$REF" in
              refs/heads/main|refs/tags/v*) ;;
              *) echo "::error::Produccion solo sale de main o de un tag v*, no de $REF."
                 exit 1 ;;
            esac
          fi
          echo "OK: $REF -> $TRACK"

      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restaurar google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json

      - name: Restaurar keystore de subida
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          printf '%s' "$RELEASE_KEYSTORE" | base64 -d > "$RUNNER_TEMP/keystore/upload.jks"

      # Destapa en segundos un keystore, alias o contrasena mal configurados, que
      # de otro modo no fallarian hasta el final de bundleRelease, ~7 minutos despues.
      - name: Validar keystore
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/keystore/upload.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: java .github/scripts/ValidateKeystore.java

      - name: Check tag matches versionName
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          GRADLE_VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "$TAG_VERSION" != "$GRADLE_VERSION" ]; then
            echo "::error::El tag ($TAG_VERSION) no coincide con versionName ($GRADLE_VERSION) en app/build.gradle.kts"
            exit 1
          fi
          echo "Publicando la versión $GRADLE_VERSION"

      # El versionCode crece con la hora para los dos workflows (ver pr-play.yml). Dos subidas
      # en el mismo cuarto de hora darian el mismo codigo y Play rechazaria la segunda: se
      # relanza pasado ese cuarto de hora.
      - name: Calcular versionCode (YYYYMMDDNN)
        run: |
          # NN = cuarto de hora UTC del dia (00-95): crece con el reloj, asi que una build mas
          # tardia siempre tiene un versionCode mayor, la lance quien la lance.
          NN=$(printf '%02d' $(( (10#$(date -u +%H) * 60 + 10#$(date -u +%M)) / 15 )))
          echo "CI_VERSION_CODE=$(date -u +%Y%m%d)$NN" >> "$GITHUB_ENV"

      - name: Tests unitarios
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build signed AAB
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/keystore/upload.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.jesuskrastev.bali
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          track: ${{ inputs.track || 'internal' }}
          # Solo se puede fijar al crear la release: la API la rechaza despues de
          # desplegarla. Un push de tag no lleva inputs y cae a 0.
          inAppUpdatePriority: ${{ inputs.priority || 0 }}
          status: completed
          whatsNewDirectory: distribution/whatsnew

      - name: Archive AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
