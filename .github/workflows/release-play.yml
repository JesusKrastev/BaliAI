name: Release to Google Play

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track de destino'
        required: true
        default: internal
        type: choice
        options: [internal, alpha, beta, production]

concurrency:
  group: release-play
  cancel-in-progress: false

jobs:
  deploy:
    name: Build AAB + upload
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ONE_SIGNAL_APP_ID: ${{ secrets.ONE_SIGNAL_APP_ID }}
      MIXPANEL_TOKEN: ${{ secrets.MIXPANEL_TOKEN }}
      REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
      POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
      POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restaurar google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json

      - name: Restaurar keystore de subida
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          printf '%s' "$RELEASE_KEYSTORE" | base64 -d > "$RUNNER_TEMP/keystore/upload.jks"

      - name: Check tag matches versionName
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          GRADLE_VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "$TAG_VERSION" != "$GRADLE_VERSION" ]; then
            echo "::error::El tag ($TAG_VERSION) no coincide con versionName ($GRADLE_VERSION) en app/build.gradle.kts"
            exit 1
          fi
          echo "Publicando la versión $GRADLE_VERSION"

      # NN en la banda 50-99 para las releases; pr-play.yml usa la 00-49, de forma que
      # los dos workflows nunca puedan generar el mismo versionCode el mismo dia.
      - name: Calcular versionCode (YYYYMMDDNN)
        run: |
          NN=$(printf '%02d' $(( 50 + GITHUB_RUN_NUMBER % 50 )))
          echo "CI_VERSION_CODE=$(date -u +%Y%m%d)$NN" >> "$GITHUB_ENV"

      - name: Tests unitarios
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build signed AAB
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/keystore/upload.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.jesuskrastev.bali
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          track: ${{ inputs.track || 'internal' }}
          status: completed
          whatsNewDirectory: distribution/whatsnew

      - name: Archive AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
